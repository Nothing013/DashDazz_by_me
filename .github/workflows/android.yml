name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --continue
        continue-on-error: true

      - name: Check for Release Keystore Secret
        id: check_secrets
        env:
          KEYSTORE_B64: ${{ secrets.DASHDAZZ_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "has_release_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not configured. Debug APK was successfully built and uploaded."
          fi

      - name: Restore release keystore
        if: ${{ steps.check_secrets.outputs.has_release_secrets == 'true' && github.event_name == 'push' }}
        env:
          KEYSTORE_B64: ${{ secrets.DASHDAZZ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/dashdazz.keystore.jks

      - name: Build release APK
        if: ${{ steps.check_secrets.outputs.has_release_secrets == 'true' && github.event_name == 'push' }}
        env:
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace "-Pdashdazz.storePassword=$STORE_PASS" "-Pdashdazz.keyPassword=$KEY_PASS" "-Pdashdazz.keyAlias=$KEY_ALIAS"

      - name: Upload release APK
        if: ${{ steps.check_secrets.outputs.has_release_secrets == 'true' && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-release
          path: app/build/outputs/apk/release/*.apk
