name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.DASHDAZZ_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/dashdazz.keystore.jks

      - name: Generate dummy signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DASHDAZZ_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          keytool -genkeypair -v \
            -keystore app/dashdazz.keystore.jks \
            -storepass dummy -keypass dummy \
            -alias dashdazz -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"

      - name: Run unit tests
        env:
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace "-Pdashdazz.storePassword=${STORE_PASS:-dummy}" "-Pdashdazz.keyPassword=${KEY_PASS:-dummy}" "-Pdashdazz.keyAlias=${KEY_ALIAS:-dashdazz}"

      - name: Build debug APK
        env:
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug --stacktrace "-Pdashdazz.storePassword=${STORE_PASS:-dummy}" "-Pdashdazz.keyPassword=${KEY_PASS:-dummy}" "-Pdashdazz.keyAlias=${KEY_ALIAS:-dashdazz}"

      - name: Build release APK
        env:
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace "-Pdashdazz.storePassword=${STORE_PASS:-dummy}" "-Pdashdazz.keyPassword=${KEY_PASS:-dummy}" "-Pdashdazz.keyAlias=${KEY_ALIAS:-dashdazz}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-release
          path: app/build/outputs/apk/release/*.apk
