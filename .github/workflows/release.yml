name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match app versionName, e.g. 2.0.53)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve and verify version
        run: |
          VER=$(./gradlew :app:printVersion --console=plain | grep "Version name" | sed 's/.*: \([0-9.]*\).*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ inputs.version }}"
            echo "Requested: $WANT, app version: $VER"
            if [ "$WANT" != "$VER" ]; then
              echo "::error::Requested version $WANT does not match app version $VER."
              exit 1
            fi
            TAG="v$WANT"
            git tag "$TAG" && git push origin "$TAG"
          else
            TAG="$GITHUB_REF_NAME"
            echo "Tag version: ${TAG#v}, app version: $VER"
            if [ "${TAG#v}" != "$VER" ]; then
              echo "::error::Tag $TAG does not match app version $VER. Move the tag or cut a new one."
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.DASHDAZZ_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets (DASHDAZZ_KEYSTORE_BASE64 / DASHDAZZ_STORE_PASSWORD / DASHDAZZ_KEY_PASSWORD / DASHDAZZ_KEY_ALIAS) are missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/dashdazz.keystore.jks

      - name: Build signed release APK
        env:
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace "-Pdashdazz.storePassword=$STORE_PASS" "-Pdashdazz.keyPassword=$KEY_PASS" "-Pdashdazz.keyAlias=$KEY_ALIAS"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk DashDazz-release.apk
          gh release create "$RELEASE_TAG" DashDazz-release.apk --generate-notes
