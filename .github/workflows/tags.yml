name: Tag Check

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Verify tag is release-triggering
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "::error::Tag '$TAG' is missing the 'v' prefix (expected 'v$TAG')."
            echo "::error::The Release workflow only triggers on 'v*' tags, so '$TAG' would never publish a release."
            echo "::error::Delete it and push 'v$TAG' instead."
            exit 1
          fi
          echo "Tag $TAG correctly uses the v prefix."

      - name: Verify tag is not a duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Tags must be unique; move the tag if this is a re-release."
            exit 1
          fi
          echo "No existing release for $TAG."